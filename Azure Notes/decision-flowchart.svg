<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="820" height="420" xmlns="http://www.w3.org/2000/svg">
  <style>
    .box { fill:#ffffff; stroke:#2b6cb0; stroke-width:2; rx:8; ry:8; }
    .title { font: 700 16px/1.2 Arial, sans-serif; fill:#1a202c; }
    .text { font: 14px/1.2 Arial, sans-serif; fill:#2d3748; }
    .arrow { stroke:#2d3748; stroke-width:2; marker-end:url(#arrowhead); fill:none; }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2d3748"/>
    </marker>
  </defs>

  <!-- Root -->
  <rect x="260" y="20" width="300" height="48" class="box" />
  <text x="410" y="51" text-anchor="middle" class="title">Which workload dominates?</text>

  <!-- Left: SQL / BI -->
  <rect x="40" y="110" width="300" height="72" class="box" />
  <text x="190" y="140" text-anchor="middle" class="title">SQL / BI heavy</text>
  <text x="190" y="160" text-anchor="middle" class="text">High concurrency reporting, Power BI</text>

  <!-- Right: ML / ETL -->
  <rect x="480" y="110" width="300" height="72" class="box" />
  <text x="630" y="140" text-anchor="middle" class="title">Data Science / ML</text>
  <text x="630" y="160" text-anchor="middle" class="text">Notebooks, streaming, ML pipelines</text>

  <!-- Arrows -->
  <line x1="410" y1="68" x2="200" y2="110" class="arrow"/>
  <line x1="410" y1="68" x2="620" y2="110" class="arrow"/>

  <!-- Recommendations -->
  <rect x="40" y="210" width="300" height="100" class="box" />
  <text x="190" y="238" text-anchor="middle" class="title">Recommendation</text>
  <text x="190" y="260" text-anchor="middle" class="text">Use Synapse (Dedicated SQL) for</text>
  <text x="190" y="278" text-anchor="middle" class="text">enterprise warehousing & Power BI</text>

  <rect x="480" y="210" width="300" height="100" class="box" />
  <text x="630" y="238" text-anchor="middle" class="title">Recommendation</text>
  <text x="630" y="260" text-anchor="middle" class="text">Use Databricks for</text>
  <text x="630" y="278" text-anchor="middle" class="text">ETL, streaming, ML & Delta Lake</text>

  <!-- Combine / Both -->
  <rect x="200" y="330" width="420" height="56" class="box" />
  <text x="410" y="358" text-anchor="middle" class="title">If you need both</text>
  <text x="410" y="376" text-anchor="middle" class="text">Databricks (processing) + Synapse (BI) is recommended</text>

  <!-- arrows down -->
  <line x1="190" y1="182" x2="260" y2="330" class="arrow"/>
  <line x1="630" y1="182" x2="540" y2="330" class="arrow"/>
</svg>
